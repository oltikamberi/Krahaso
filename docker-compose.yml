services:
  postgres:
    image: postgres:16-alpine
    container_name: krahaso-postgres
    environment:
      POSTGRES_DB: krahaso
      POSTGRES_USER: krahaso
      POSTGRES_PASSWORD: krahaso
    ports:
      # 5433 on the host to avoid clashing with a local Homebrew Postgres on 5432
      - "5433:5432"
    volumes:
      - krahaso_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krahaso"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: krahaso-redis
    ports:
      - "6379:6379"
    volumes:
      - krahaso_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for seller feed uploads. In production this is
  # swapped for real S3/R2 by pointing KRAHASO_STORAGE_* at the managed endpoint.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: krahaso-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: krahaso
      MINIO_ROOT_PASSWORD: krahaso-dev-secret
    ports:
      # 9000 S3 API, 9001 web console
      - "9000:9000"
      - "9001:9001"
    volumes:
      - krahaso_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  krahaso_pgdata:
  krahaso_redisdata:
  krahaso_miniodata:
