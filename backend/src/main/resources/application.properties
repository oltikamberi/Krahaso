spring.application.name=krahaso

# --- Database (Docker Postgres, see root docker-compose.yml) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/krahaso}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:krahaso}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:krahaso}

# Schema is owned by Flyway migrations (db/migration) — Hibernate never touches it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Redis cache (set SPRING_DATA_REDIS_URL on Render/Upstash; falls back to local) ---
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.cache.type=${SPRING_CACHE_TYPE:redis}
spring.cache.redis.time-to-live=5m

# Comma-separated frontend origins (local + Vercel)
krahaso.cors.allowed-origins=${KRAHASO_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Server port (Render sets PORT)
server.port=${PORT:8080}

# --- Seller dashboard auth ---
# Dev-only secret. Override with KRAHASO_SELLER_TOKEN_SECRET in every real environment.
krahaso.seller.token-secret=${KRAHASO_SELLER_TOKEN_SECRET:dev-only-insecure-seller-token-secret-change-me}
krahaso.seller.token-ttl=7d

# --- Object storage for seller feed uploads (MinIO locally, S3/R2 in production) ---
krahaso.storage.endpoint=${KRAHASO_STORAGE_ENDPOINT:http://localhost:9000}
krahaso.storage.region=${KRAHASO_STORAGE_REGION:us-east-1}
krahaso.storage.bucket=${KRAHASO_STORAGE_BUCKET:krahaso-feeds}
krahaso.storage.access-key=${KRAHASO_STORAGE_ACCESS_KEY:krahaso}
krahaso.storage.secret-key=${KRAHASO_STORAGE_SECRET_KEY:krahaso-dev-secret}
# MinIO needs path-style addressing; real S3 works either way
krahaso.storage.path-style=${KRAHASO_STORAGE_PATH_STYLE:true}

# --- Seller feeds ---
# A feed is shown as stale in the dashboard when it has not synced within this window
krahaso.feed.stale-after=${KRAHASO_FEED_STALE_AFTER:72h}
krahaso.feed.max-upload-bytes=20971520

# --- Feed URL polling ---
# How often the scheduler looks for due feeds; each feed's own cadence is per-seller
krahaso.feed.poll-interval=${KRAHASO_FEED_POLL_INTERVAL:5m}
krahaso.feed.poll-initial-delay=30s
# Default cadence when the seller does not pick one (6 hours)
krahaso.feed.default-schedule-minutes=360
krahaso.feed.fetch-timeout=30s
krahaso.feed.max-download-bytes=20971520
# Longest wait after repeated failures, so a dead feed is still retried daily
krahaso.feed.max-backoff=24h
# Dev-only. Feed URLs are seller-supplied, so allowing private addresses makes this
# server an SSRF proxy into its own network. Set to false in every real environment.
krahaso.feed.allow-private-hosts=${KRAHASO_FEED_ALLOW_PRIVATE_HOSTS:true}

# --- Seller webhooks ---
# Shown to the seller when they generate a key, so it must be the public address
krahaso.webhook.url=${KRAHASO_WEBHOOK_URL:http://localhost:8080/api/webhooks/offers}
# How far a request timestamp may drift before it is rejected as a possible replay
krahaso.webhook.timestamp-tolerance=5m
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
