spring.application.name=krahaso

# --- Database (Docker Postgres, see root docker-compose.yml) ---
spring.datasource.url=jdbc:postgresql://localhost:5433/krahaso
spring.datasource.username=krahaso
spring.datasource.password=krahaso

# Schema is owned by Flyway migrations (db/migration) — Hibernate never touches it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Redis cache ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=5m
